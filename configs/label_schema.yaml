# AOI Defect Classification — 标注体系 & 数据结构定义 v3.0
# =============================================================================
# 设计原则:
#   - 以"缺陷实例"为核心标注单元，每张图可有多个实例
#   - 整图主类别/次类别由实例标注结果自动汇总生成
#   - annotations.json 是唯一标注数据源
#   - 坐标全部使用原图像素坐标（非归一化）
# =============================================================================

# ---------------------------------------------------------------------------
# 缺陷类别 A–G
# ---------------------------------------------------------------------------
defect_classes:
  A:
    name: residue_cleaning
    display_name: 胶残留 / 清洗不净
    description: 表面局部发黑、胶膜残留、大片脏污、纹理变暗
  B:
    name: edge_glue
    display_name: 边缘挂胶 / 胶丝 / 溢胶
    description: 边缘线状、条状、片状残留，像线一样垂在外侧
  C:
    name: particle
    display_name: 颗粒 / 异物
    description: 孤立小黑点、小亮点、小颗粒团
  D:
    name: pad_abnormal
    display_name: pad / 植球开口异常
    description: 六个开口被污染、遮挡、缺失、变形、边界异常
  E:
    name: surface_damage
    display_name: 刻蚀 / 表面损伤
    description: 局部刻穿、烧蚀状、破损、露底、不规则破坏
  F:
    name: pi_broken
    display_name: Pad PI 胶破损 / 露金属
    description: Pad 区域 PI 胶破裂，露出下层金属层，金属反光明显
  G:
    name: uncertain_other
    display_name: 其他 / 不确定 / AOI误报
    description: 人工暂时无法确认，或疑似光照反射误报

# ---------------------------------------------------------------------------
# 局部正常区域类别 N1–N3
# ---------------------------------------------------------------------------
normal_classes:
  N1:
    name: pseudo_normal_surface
    display_name: 局部正常表面
    description: 当前视野下未见明显缺陷的芯片表面区域
  N2:
    name: pseudo_normal_pad
    display_name: 局部正常 pad
    description: 当前视野下未见明显缺陷的植球开口或 pad 区域
  N3:
    name: pseudo_normal_edge
    display_name: 局部正常边缘
    description: 当前视野下未见明显缺陷的芯片边缘区域

# ---------------------------------------------------------------------------
# 区域类型
# ---------------------------------------------------------------------------
regions:
  - surface
  - edge
  - pad
  - background
  - unknown

# ---------------------------------------------------------------------------
# 严重程度
# ---------------------------------------------------------------------------
severity:
  1: 轻微
  2: 中等
  3: 严重

# ---------------------------------------------------------------------------
# 标注质量
# ---------------------------------------------------------------------------
quality:
  - good
  - uncertain
  - bad

# ---------------------------------------------------------------------------
# 几何形状类型
# ---------------------------------------------------------------------------
geometry_types:
  - rectangle
  - polygon

# ---------------------------------------------------------------------------
# 图片标注状态
# ---------------------------------------------------------------------------
image_status:
  - unstarted
  - in_progress
  - done
  - skipped
  - uncertain
